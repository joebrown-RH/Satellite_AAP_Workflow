- name: Setup AAP
  hosts: all
  gather_facts: false
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: /api
  vars:
    aap_inventory: "Workshop Inventory"
  tasks:
    - name: Create Project
      ansible.controller.project:
        controller_host: "{{ aap_server_url | default(omit) }}"
        controller_username: "{{ aap_username | default(omit) }}"
        controller_password: "{{ aap_password | default(omit) }}"
        organization: "{{ aap_organization | default(omit) }}"
        validate_certs: "{{ aap_validate_certs | default(omit) }}"

        name: "Satellite Jobs"
        description: "Jobs for controlling Satellite"
        scm_update_on_launch: true
        scm_update_cache_timeout: 60
        state: present
        scm_branch: main
        scm_type: git
        scm_url: https://github.com/joebrown-RH/Satellite_AAP_Workflow.git
      
      
    - name: Create Jobs
      ansible.controller.job_template:
        controller_host: "{{ aap_server_url | default(omit) }}"
        controller_username: "{{ aap_username | default(omit) }}"
        controller_password: "{{ aap_password | default(omit) }}"
        organization: "{{ aap_organization | default(omit) }}"
        validate_certs: "{{ aap_validate_certs | default(omit) }}"

        name: "Satellite/{{ item.name }}"
        job_type: "run"
        inventory: "{{ aap_inventory }}"
        project: "Satellite Jobs"
        playbook: "{{ item.playbook }}"
        state: "present"
      loop:
        - name: Publish
          playbook: publish/publish.yaml
        - name: Clean Emergency CV
          playbook: clean_emergency/clean_emergency.yaml
        - name: Emergency Publish
          playbook: emergency/publish.yaml
        - name: Promote Content View
          playbook: promote_cv/promote.yaml
        - name: Report Errata
          playbook: report_errata/errata_installable.yaml
      
    - name: Create Workflows
      ansible.controller.workflow_job_template:
        controller_host: "{{ aap_server_url | default(omit) }}"
        controller_username: "{{ aap_username | default(omit) }}"
        controller_password: "{{ aap_password | default(omit) }}"
        organization: "{{ aap_organization | default(omit) }}"
        validate_certs: "{{ aap_validate_certs | default(omit) }}"

        name: "{{ item.name }}"
        inventory: "{{ aap_inventory }}"
        workflow_nodes: "{{ lookup('file', '../workflows/' ~ item.nodes ) | from_yaml }}"
      loop:
        - name: Publish Content Views
          nodes: publish.yaml
