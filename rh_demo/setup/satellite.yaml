- name: Configure Satellite Server for Demo
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create Lifecycle Environments
      redhat.satellite.lifecycle_environment:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "{{ item.name }}"
        prior: "{{ item.prior }}"
        state: "present"
      loop: "{{ lifecycle_environments }}"

    - name: Enable RHEL 7 Repo Sets
      redhat.satellite.repository_set:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        label: "{{ item }}"
        repositories:
          - releasever: "7Server"
            basearch: "x86_64"
      loop:
        - rhel-7-server-rpms

    - name: Enable Repo Sets
      redhat.satellite.repository_set:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        label: "rhel-{{ item[0] }}-for-x86_64-{{ item[1] | lower }}-rpms"
        repositories:
          - releasever: "{{ item[0] }}"
      loop: "{{ os_versions | product(repositories) | list }}"

    - name: Sync RHEL 7 repos
      when: satellite_sync
      redhat.satellite.repository_sync:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        product: "Red Hat Enterprise Linux Server"
      async: 3600
      poll: 0
      register: rh7_sync_job

    - name: Sync RHEL repos
      when: satellite_sync
      redhat.satellite.repository_sync:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        product: "Red Hat Enterprise Linux for x86_64"
      async: 3600
      poll: 0
      register: rh_sync_job

    - name: Create EPEL GPG Key entry
      redhat.satellite.content_credential:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "EPEL {{ item }} GPG"
        content_type: gpg_key
        content: "{{ lookup('ansible.builtin.url', 'https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-' ~ item, split_lines=False) }}"
      loop: "{{ os_versions }}"

    - name: Create EPEL Product entry
      redhat.satellite.product:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "EPEL"
        state: present

    - name: Add EPEL Repositories to Product Entry
      redhat.satellite.repository:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "EPEL {{ item }}"
        state: present
        content_type: "yum"
        product: "EPEL"
        url: "https://dl.fedoraproject.org/pub/epel/{{ item }}/Everything/x86_64/"
        gpg_key: "EPEL {{ item }} GPG"
      loop: "{{ os_versions }}"

    - name: Sync EPEL repos
      when: satellite_sync
      redhat.satellite.repository_sync:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        product: "EPEL"
      async: 3600
      poll: 0
      register: epel_sync_job

    - name: Create Emergency Content View
      redhat.satellite.content_view:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "cv_Emergency"
        repositories: []
    
    # - name: Create Emergency Content View Errata Filter
    #   redhat.satellite.content_view_filter:
    #     username: "{{ satellite_username | default(omit) }}"
    #     password: "{{ satellite_password | default(omit) }}"
    #     server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
    #     validate_certs: "{{ satellite_validate_certs | default(omit) }}"
    #     organization: "{{ satellite_organization | default(omit) }}"
    #     name: "errata"
    #     content_view: "cv_Emergency"
    #     filter_type: erratum
    #     inclusion: true

    - name: Create RHEL Content View
      redhat.satellite.content_view:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "cv_RHEL"
        repositories: >-
          {%- set result = [] -%}
          {%- for item in os_versions | product(repositories) | list -%}
            {%- set _ = result.append({'name': "Red Hat Enterprise Linux " ~ item[0] ~ " for x86_64 - " ~ item[1] ~ " RPMs " ~ item[0], 'product': "Red Hat Enterprise Linux for x86_64"}) -%}
          {%- endfor -%}
          {{ result }}
    
    - name: Create EPEL Content View
      redhat.satellite.content_view:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "cv_EPEL"
        repositories: >-
          {%- set result = [] -%}
          {%- for item in os_versions -%}
            {%- set _ = result.append({'name': "EPEL " ~ item, 'product': "EPEL"}) -%}
          {%- endfor -%}
          {{ result }}
    
    - name: Create Composite Content Views
      redhat.satellite.content_view:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "ccv_RHEL_EPEL"
        composite: true
        components:
          - content_view: cv_RHEL
            latest: true
          - content_view: cv_EPEL
            latest: true

    - name: Publish and Promote ccv_RHEL_EPEL
      when: satellite_publish_promote
      redhat.satellite.content_view_version:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        content_view: "ccv_RHEL_EPEL"
        lifecycle_environments: "{{ lifecycle_environments | json_query('[].name') }}"

    - name: "Create host collections for patch groups"
      redhat.satellite.host_collection:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "Patch Group {{ item }}"
        description: "Patch group for stage {{ item }}"
        state: present
      loop:
        - 1
        - 2
        - 3

    - name: Create Host Groups
      redhat.satellite.hostgroup:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ item.name }}"
        state: present
        lifecycle_environment: "{{ item.lifecycle | default('Prod')}}"
        content_view: "ccv_RHEL_EPEL"
      loop:
        - name: Satellite
        - name: Satellite/Capsules
        - name: General
        - name: General/Department1
        - name: General/Department1/Department1-Dev
          lifecycle: Dev
        - name: General/Department1/Department1-Test
          lifecycle: Test
        - name: General/Department1/Department1-QA
          lifecycle: QA
        - name: General/Department1/Department1-Prod
          lifecycle: Prod

    - name: Assign Nodes to Host Groups
      redhat.satellite.host:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ item.name }}"
        hostgroup: "{{ item.group }}"

        state: present
      loop:
        - name: node1.example.com
          group: General/Department1/Department1-Prod
          collection: Patch Group 1
        - name: node2.example.com
          group: General/Department1/Department1-Prod
          collection: Patch Group 2
        - name: node3.example.com
          group: General/Department1/Department1-Prod
          collection: Patch Group 3

    - name: Wait for RHEL Sync Jobs
      when: satellite_sync
      ansible.builtin.async_status:
        jid: "{{ rh_sync_job.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 30
      delay: 10
    
    - name: Wait for EPEL Sync Jobs
      when: satellite_sync
      ansible.builtin.async_status:
        jid: "{{ epel_sync_job.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 30
      delay: 10

