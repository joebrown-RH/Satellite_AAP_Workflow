[defaults]
# Convenience defaults for running these playbooks from a workstation.
# Inside AAP the controller supplies inventory, roles and collections paths,
# and its environment variables take precedence over this file.
inventory = inventories/satellite/hosts.yml
roles_path = roles
host_key_checking = False
stdout_callback = yaml

[inventory]
unparsed_is_failed = True

[ssh_connection]
pipelining = True
