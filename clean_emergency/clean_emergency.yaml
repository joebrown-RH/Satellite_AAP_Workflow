---
- name: Cleanup Emergency Content View
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get list of Composite Content Views
      redhat.satellite.content_view_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        search: "composite = true"
      register: composite_content_views

    - name: Get current content of Compose Content Views
      redhat.satellite.content_view_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ composite_content_view }}"
      register: content_view_content
      loop: "{{ composite_content_views | json_query('content_views[].name') }}"
      loop_control:
        loop_var: "composite_content_view"

    - name: Remove Emergency Content View From Composite Content Views
      when: emergency_content_view in composite_content_view.content | map(attribute='content_view') | list
      redhat.satellite.content_view:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ composite_content_view.name }}"
        components: "{{ composite_content_view.content | json_query('[?content_view != `' ~ emergency_content_view ~ '`]') }}"
      loop: "{{ content_view_content.results | json_query('[].content_view.{ name: name, content: content_view_components[].{ content_view: content_view_version.content_view.name, latest: latest, version: content_view_version.version} }') }}"
      loop_control:
        loop_var: "composite_content_view"

    - name: Get list of rules in Emergency Content View
      redhat.satellite.content_view_filter_rule_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ emergency_content_view }}"
        content_view_filter: "errata"
      register: errata_rules
      ignore_errors: true

    - name: Remove old Emergency Content View Rules
      when: errata_rules is not failed
      redhat.satellite.content_view_filter_rule:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ emergency_content_view }}"
        content_view_filter: "errata"
        errata_id: "{{ rule.errata_id }}"
        state: absent
      loop: "{{ errata_rules.content_view_filter_rules }}"
      loop_control:
        loop_var: rule
