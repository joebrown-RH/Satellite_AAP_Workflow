---
# Control-plane inventory for the Satellite API playbooks
# (publish / promote / emergency_publish / clean_emergency).
#
# These playbooks drive the Satellite REST API, so the "target" is really just
# a place for the tasks to execute. localhost inside the execution environment
# is correct and needs no SSH access to the Satellite server at all.
#
# In AAP this is created as the "Satellite Control" inventory - see
# aap_config/inventories.yml.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
