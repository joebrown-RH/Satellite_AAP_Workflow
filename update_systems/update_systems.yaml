---
- name: Update RHEL Systems
  hosts: all
  gather_facts: false

  tasks:
    - name: Update all packages
      ansible.builtin.package:
        name: '*'
        state: latest

    - name: Include least reboot tasks
      when: reboot == "least"
      ansible.builtin.include_tasks:
        file: restart_least.yaml
    
    - name: Reboot always
      when: reboot == "always"
      ansible.builtin.reboot:
