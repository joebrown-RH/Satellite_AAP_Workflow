---
# Talks to the Satellite API over HTTPS; does not need to run ON the Satellite
# server. Runs once against a single target so the emergency content view is
# detached and emptied exactly once.
# Required Variables:
#   satellite_username     = Username for Satellite access
#   satellite_password     = Password for Satellite access
#   satellite_server_url   = URL for Satellite access
#   satellite_organization = Satellite Organization to operate within
#   emergency_content_view = Content View name for emergency (out of cycle) patches
# Optional Variables:
#   satellite_validate_certs = Whether to validate the Satellite https certificate (default: true)
- name: Cleanup Emergency Content View
  hosts: "{{ satellite_target | default('localhost') }}"
  connection: local
  gather_facts: false

  tasks:
    - name: Get list of rules in Emergency Content View
      redhat.satellite.content_view_filter_rule_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ emergency_content_view }}"
        content_view_filter: "errata"
      register: errata_rules
      ignore_errors: true

    - name: Remove old Emergency Content View Rules
      when: errata_rules is not failed
      redhat.satellite.content_view_filter_rule:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ emergency_content_view }}"
        content_view_filter: "errata"
        errata_id: "{{ rule.errata_id }}"
        state: absent
      loop: "{{ errata_rules.content_view_filter_rules }}"
      loop_control:
        loop_var: rule

    - name: Publish version of the Emergency Content Views
      redhat.satellite.content_view_version:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ emergency_content_view }}"
