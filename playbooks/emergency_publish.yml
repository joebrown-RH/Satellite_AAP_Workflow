---
# Talks to the Satellite API over HTTPS; does not need to run ON the Satellite
# server. Runs once against a single target so the emergency content view is
# built and published exactly once.
- name: Publish Emergency Content View
  hosts: "{{ satellite_target | default('localhost') }}"
  connection: local
  gather_facts: false

  vars:
    # An AAP survey textarea hands back one newline-delimited string, but a
    # command-line run passes a real list. Accept either so the same playbook
    # works from the controller and from a workstation.
    #
    # Splitting on any whitespace rather than on newlines specifically: errata
    # advisory IDs never contain whitespace, so this also absorbs stray
    # spaces, blank lines and CRLF endings from a pasted survey answer.
    errata_id_list: >-
      {{ errata_ids
         if (errata_ids is sequence and errata_ids is not string)
         else (errata_ids | split | select | list) }}

  tasks:
    - name: Get Repositories
      redhat.satellite.repository_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        search: "{{ repository.query }}"
        product: "{{ repository.product }}"
      register: repo_list
      loop: "{{ repositories }}"
      loop_control:
        loop_var: "repository"

    - name: Ensure Emergency Content View exists
      redhat.satellite.content_view:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ emergency_content_view | default(omit) }}"
        repositories: "{{ repo_list.results | json_query('[0].repositories[].{ name: name, product: product.name }') }}"
        solve_dependencies: false

    - name: "Check if Errata Filter exists"
      redhat.satellite.content_view_filter_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        content_view: "{{ emergency_content_view | default(omit) }}"
        name: "errata"
      register: errata_filter

    - name: Get Content View Information
      when: errata_filter.content_view_filter is none
      redhat.satellite.content_view_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"
        name: "{{ emergency_content_view | default(omit) }}"
      register: emergency_cv_info

    # The Ansible module redhat.satellite.content_view_filter creates the filter as erratum_date, which does not work for this purpose
    - name: Create Errata Filter
      when: errata_filter.content_view_filter is none
      ansible.builtin.uri:
        url: "{{ satellite_server_url }}/katello/api/content_views/{{ emergency_cv_info.content_view.id }}/filters"
        method: POST
        body_format: json
        body:
          name: errata
          type: erratum_id
          inclusion: true
        status_code:
          - 200
          - 201
        force_basic_auth: true
        url_username: "{{ satellite_username | default(omit) }}"
        url_password: "{{ satellite_password | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"

    - name: "Include errata"
      redhat.satellite.content_view_filter_rule:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ emergency_content_view | default(omit) }}"
        content_view_filter: "errata"
        state: present
        errata_id: "{{ errata_id }}"
      loop: "{{ errata_id_list | sort | unique | list }}"
      loop_control:
        loop_var: "errata_id"

    - name: Publish version of the Emergency Content View
      redhat.satellite.content_view_version:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ emergency_content_view | default(omit) }}"

    - name: Get list of Composite Content Views
      redhat.satellite.content_view_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        search: "{{ composite_content_view_query }}"
      register: composite_content_views
      loop: "{{ composite_content_view_queries }}"
      loop_control:
        loop_var: "composite_content_view_query"

    - name: Get current content of Compose Content Views
      redhat.satellite.content_view_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ composite_content_view }}"
      register: content_view_content
      loop: "{{ composite_content_views.results | json_query('[].content_views[].name') }}"
      loop_control:
        loop_var: "composite_content_view"

    - name: Add Emergency Content View to Composite Content Views
      when: emergency_content_view not in composite_content_view.content | map(attribute='content_view') | list
      redhat.satellite.content_view:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ composite_content_view.name }}"
        components: "{{ composite_content_view.content + [{'content_view': emergency_content_view, 'latest': true}] }}"
      loop: "{{ content_view_content.results | json_query('[].content_view.{ name: name, content: content_view_components[].{ content_view: content_view_version.content_view.name, latest: latest, version: content_view_version.version} }') }}"
      loop_control:
        loop_var: "composite_content_view"

    - name: Publish version of the Composite Content Views
      redhat.satellite.content_view_version:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        content_view: "{{ content_view }}"

      poll: 0
      loop: "{{ composite_content_views.results | json_query('[].content_views[].name') }}"
      loop_control:
        loop_var: "content_view"
      async: 3600
      register: async_results

    - name: Wait for Composite Content Views to finish publishing
      async_status:
        jid: "{{ async_result_item.ansible_job_id }}"
      loop: "{{ async_results.results }}"
      loop_control:
        loop_var: "async_result_item"
      register: async_poll_results
      until: async_poll_results.finished
      retries: 3600

    - name: Ensure the publish succeeded
      ansible.builtin.assert:
        that:
          - async_result is success
        failed_msg: Not all Composite Content Views published successfully
      loop: "{{ async_poll_results }}"
      loop_control:
        loop_var: "async_result"