---
- name: Get Installable Errata
  hosts: "{{ host_query | default('foreman_' ~ (host_group | lower | replace('/', '_') | replace('-', '_'))) }}"
  gather_facts: false

  tasks:
    - name: Get Host Info
      delegate_to: localhost
      redhat.satellite.host_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ host | default(inventory_hostname) }}"
      register: host_info

    - name: Get Lifecycle Environment
      delegate_to: localhost
      when: lifecycle_environment | default(false) | bool
      redhat.satellite.lifecycle_environment:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        name: "{{ lifecycle_environment | default(omit) }}"
      register: lifecycle_environment_info

    - name: Store previous Lifecycle Environment
      when: lifecycle_environment | default(false) | bool
      set_fact:
        previous_lifecycle_environment: "{{ (lifecycle_environment_info.entity.lifecycle_environments | first).prior.name }}"

    - name: Get Host Errata
      when: host_info.host.content_view.name | length > 0 # Ignore hosts without content
      delegate_to: localhost
      redhat.satellite.host_errata_info:
        username: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        server_url: "{{ satellite_server_url | default('https://' + inventory_hostname) | default(omit) }}"
        validate_certs: "{{ satellite_validate_certs | default(omit) }}"
        organization: "{{ satellite_organization | default(omit) }}"

        host: "{{ host | default(inventory_hostname) }}"
        content_view: "{{ host_info.host.content_view.name }}"
        lifecycle_environment: "{{ previous_lifecycle_environment | default(lifecycle_environment) | default(omit) }}"
      register: host_errata_info

    - name: Debug
      when: host_info.host.content_view # Ignore hosts without content
      debug:
        var: host_errata_info.host_errata
    
    - name: Store for future workflow steps
      when: host_info.host.content_view # Ignore hosts without content
      ansible.builtin.set_stats:
        data:
          available_errata: "{ '{{ host | default(inventory_hostname) }}': {{ host_errata_info.host_errata }} }"
        per_host: false
        aggregate: true
