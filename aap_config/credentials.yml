---
# The Satellite API credential, built from the custom type in
# credential_types.yml.
#
# The password is NOT stored in this repo. Supply it when you run
# playbooks/configure_aap.yml, by whichever route suits your pipeline:
#
#   export SATELLITE_PASSWORD='...'
#   ansible-playbook playbooks/configure_aap.yml
#
# or from a vault file that stays outside the repo:
#
#   ansible-playbook playbooks/configure_aap.yml \
#     -e @~/.satellite-secrets.yml --vault-password-file ~/.vault_pass
#
# or omit it entirely and have an admin fill the password in the AAP UI once -
# set sat_manage_credential to false below and the credential is left alone.
sat_manage_credential: true

sat_satellite_username: "{{ lookup('env', 'SATELLITE_USERNAME') | default('admin', true) }}"
sat_satellite_password: "{{ lookup('env', 'SATELLITE_PASSWORD') | default('', true) }}"

controller_credentials:
  - name: "{{ sat_prefix }}API"
    description: "Satellite API login used by every template in this bundle"
    organization: "{{ sat_aap_organization }}"
    credential_type: "Red Hat Satellite - API"
    state: "{{ 'present' if sat_manage_credential else 'exists' }}"
    inputs:
      satellite_server_url: "{{ sat_url }}"
      satellite_username: "{{ sat_satellite_username }}"
      satellite_password: "{{ sat_satellite_password }}"
      satellite_organization: "{{ sat_organization }}"
      satellite_validate_certs: "{{ sat_validate_certs }}"

  # Machine credential for SSH-ing to the RHEL clients during patching.
  # Left as `exists` so re-running this bundle never overwrites the customer's
  # own SSH key material.
  - name: "{{ sat_prefix }}Client SSH"
    description: "SSH access to the managed RHEL hosts for patching"
    organization: "{{ sat_aap_organization }}"
    credential_type: "Machine"
    state: exists

  # The satellite6 inventory plugin needs AAP's built-in "Red Hat Satellite 6"
  # type, not our custom API type - so the same login is held twice. Also
  # `exists`, so the customer fills it in once in the UI and re-running this
  # bundle never clears it.
  - name: "{{ sat_prefix }}Inventory Source"
    description: "Red Hat Satellite 6 credential for dynamic inventory sync"
    organization: "{{ sat_aap_organization }}"
    credential_type: "Red Hat Satellite 6"
    state: exists
