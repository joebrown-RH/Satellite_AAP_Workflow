---
# A custom credential type is what lets this bundle be shared safely.
#
# Why not Ansible Vault + extra_vars (the original approach)?
#   - a vault password has to be distributed alongside the repo
#   - the encrypted secret still lives in git history forever
#   - rotating the password means a new commit
#
# With a credential type the customer creates ONE credential in their own AAP,
# attaches it to every template, and nothing sensitive is ever committed.
#
# The injected variable names match what the playbooks already read, so no
# playbook changes are required:
#   satellite_username / satellite_password / satellite_server_url /
#   satellite_validate_certs / satellite_organization
controller_credential_types:
  - name: "Red Hat Satellite - API"
    description: "API login for the Satellite content-view and errata playbooks"
    kind: cloud
    state: present
    inputs:
      fields:
        - id: satellite_server_url
          type: string
          label: "Satellite URL"
          help_text: "Full base URL, e.g. https://satellite.example.com"
        - id: satellite_username
          type: string
          label: "Username"
        - id: satellite_password
          type: string
          label: "Password"
          secret: true
        - id: satellite_organization
          type: string
          label: "Satellite organization"
          help_text: "Organization that owns the content views, e.g. Demo"
        - id: satellite_validate_certs
          type: boolean
          label: "Validate TLS certificates"
          default: true
      required:
        - satellite_server_url
        - satellite_username
        - satellite_password
        - satellite_organization
    # {% raw %} keeps these as literal Jinja for the AAP API to resolve at job
    # launch - they must NOT be rendered while this file is being read.
    injectors:
      extra_vars:
        satellite_server_url: "{% raw %}{{ satellite_server_url }}{% endraw %}"
        satellite_username: "{% raw %}{{ satellite_username }}{% endraw %}"
        satellite_password: "{% raw %}{{ satellite_password }}{% endraw %}"
        satellite_organization: "{% raw %}{{ satellite_organization }}{% endraw %}"
        satellite_validate_certs: "{% raw %}{{ satellite_validate_certs }}{% endraw %}"
